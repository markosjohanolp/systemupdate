name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y zip unzip openjdk-17-jdk wget

    - name: Install Android SDK and accept licenses
      run: |
        mkdir -p android-sdk/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip commandlinetools-linux-9477386_latest.zip -d android-sdk/cmdline-tools
        mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
        export ANDROID_SDK_ROOT=$PWD/android-sdk
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

    - name: Create symbolic links for buildozer
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk
        ln -sf $ANDROID_SDK_ROOT ~/.buildozer/android/platform/android-sdk
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest ~/.buildozer/android/platform/android-sdk/tools

    - name: Install buildozer
      run: |
        pip install buildozer cython

    - name: Fix buildozer.spec
      run: |
        sed -i 's/^android.sdk =.*/android.sdk = 30/' buildozer.spec || echo "android.sdk = 30" >> buildozer.spec
        sed -i 's/^android.ndk =.*/android.ndk = 28c/' buildozer.spec || echo "android.ndk = 28c" >> buildozer.spec
        sed -i 's/^android.ant_path =.*/android.ant_path = /' buildozer.spec

    - name: Build APK
      run: |
        export ANDROID_SDK_ROOT=$PWD/android-sdk
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app
        path: bin/*.apk
